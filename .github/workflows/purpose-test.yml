name: Purpose tests
on:
  push:
    paths: ['purpose/**', '.github/workflows/purpose-test.yml']
  pull_request:
    paths: ['purpose/**', '.github/workflows/purpose-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: purpose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
